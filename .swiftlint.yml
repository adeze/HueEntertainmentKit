disabled_rules:
  - trailing_comma
  - todo
  - large_tuple
  - force_try

opt_in_rules:
  - empty_count

identifier_name:
  min_length:
    warning: 1
  allowed_symbols:
    - "_"
  excluded:
    - x
    - y
    - z
    - r
    - g
    - b
    - a
    - p
    - t
    - to
    - dx
    - dy
    - cx
    - cy
    - cz
    - X
    - Y
    - Z
    - id
    - xy

line_length:
  warning: 1000
  error: 2000
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

cyclomatic_complexity:
  warning: 15
  error: 25

function_body_length:
  warning: 100
  error: 150

excluded:
  - .build
  - DerivedData
  - Examples/HueAudioReactiveAUv3/HueAudioReactiveAUv3.xcodeproj
